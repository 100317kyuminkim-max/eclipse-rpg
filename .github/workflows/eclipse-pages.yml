name: Deploy ECLIPSE to Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release containing the ECLIPSE game archive"
        default: v11
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'docs/**'

concurrency:
  group: eclipse-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare game files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v11' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages-site
          if [[ -f docs/index.html ]]; then
            cp -a docs/. pages-site/
          else
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'ECLIPSE_V*_GitHub_Pages.zip' --dir "$RUNNER_TEMP"
            archives=("$RUNNER_TEMP"/ECLIPSE_V*_GitHub_Pages.zip)
            test "${#archives[@]}" -eq 1
            unzip -q "${archives[0]}" -d "$RUNNER_TEMP/eclipse"
            sites=("$RUNNER_TEMP"/eclipse/pages-v*/docs)
            test "${#sites[@]}" -eq 1
            cp -a "${sites[0]}"/. pages-site/
          fi
          test -f pages-site/index.html
          test -f pages-site/game.js
          test -f pages-site/combat.js
          test -d pages-site/animation
          test -d pages-site/projectiles
          test "$(find pages-site -type f | wc -l)" -ge 1500
          touch pages-site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload complete game
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: pages-site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm Pages artifact is visible
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' || true)
            if [[ "$count" == 1 ]]; then
              echo "Pages artifact is ready."
              exit 0
            fi
            sleep 5
          done
          echo "Pages artifact is not visible after waiting."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
